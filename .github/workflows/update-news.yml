name: Update news

on:
  schedule:
    # 07:00, 11:00, 15:00 and 19:00 India time (the times below are UTC)
    - cron: "30 1,5,9,13 * * *"
  workflow_dispatch:   # lets you press "Run workflow" by hand

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch news and write summaries
        run: python update_news.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Save changes
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add money_shorts.txt
          if git diff --cached --quiet; then
            echo "No changes to save"
          else
            git commit -m "Update news"
            git push
          fi
